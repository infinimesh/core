name: Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Swagger matches proto
        run: sh scripts/swagger_check.sh

      - name: release scripts
        run: sh scripts/release_test.sh

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: go vet ./...

      - name: race
        run: make race

      - name: fuzz
        run: make test-fuzz

  console:
    name: console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          set +e
          govulncheck -format json ./... > vuln.json
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          python3 - <<'PY'
          import json, sys
          dec = json.JSONDecoder()
          raw = open("vuln.json").read()
          i = 0
          fixed = []
          while i < len(raw):
              while i < len(raw) and raw[i].isspace():
                  i += 1
              if i >= len(raw):
                  break
              msg, n = dec.raw_decode(raw, i)
              i = n
              finding = msg.get("finding")
              if not finding:
                  continue
              called = any(str(frame.get("module", "")).startswith("github.com/infinimesh/") for frame in finding.get("trace", []))
              version = finding.get("fixed_version")
              if called and version:
                  fixed.append(f"{finding.get('osv')} fixed in {version}")
          if fixed:
              print("Reachable vulnerabilities with a released fix:")
              print("\n".join(sorted(set(fixed))))
              sys.exit(1)
          print("No reachable vulnerability has a released fix.")
          PY
