name: Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.total }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Swagger matches proto
        run: sh scripts/swagger_check.sh

      - name: Install buf
        run: |
          curl -sSL -o /usr/local/bin/buf \
            "https://github.com/bufbuild/buf/releases/download/v1.55.1/buf-$(uname -s)-$(uname -m)"
          chmod +x /usr/local/bin/buf
          buf --version

      - name: buf lint pinned proto
        run: sh scripts/buf_lint_pin.sh

      - name: release scripts
        run: sh scripts/release_test.sh

      - name: Stable release prerequisites
        run: sh scripts/check-stable.sh .

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: go vet ./...

      - name: race
        run: make race

      - name: fuzz
        run: make test-fuzz

      - name: coverage script
        run: sh scripts/cover_test.sh

      - name: coverage
        id: coverage
        run: sh scripts/cover.sh

  coverage-badge:
    name: coverage badge
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Publish coverage.json to the badges branch
        env:
          TOTAL: ${{ needs.test.outputs.coverage }}
        run: |
          if [ -z "$TOTAL" ]; then
            echo "No coverage total from the test job." >&2
            exit 1
          fi
          color=red
          if awk -v t="$TOTAL" 'BEGIN { exit !(t >= 80) }'; then
            color=brightgreen
          elif awk -v t="$TOTAL" 'BEGIN { exit !(t >= 60) }'; then
            color=yellow
          fi
          git switch --orphan badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$TOTAL" "$color" > coverage.json
          git add coverage.json
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Coverage badge: ${TOTAL}%"
          git push --force origin badges

  console:
    name: console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          set +e
          govulncheck -format json ./... > vuln.json
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          python3 - <<'PY'
          import json, sys
          dec = json.JSONDecoder()
          raw = open("vuln.json").read()
          i = 0
          fixed = []
          while i < len(raw):
              while i < len(raw) and raw[i].isspace():
                  i += 1
              if i >= len(raw):
                  break
              msg, n = dec.raw_decode(raw, i)
              i = n
              finding = msg.get("finding")
              if not finding:
                  continue
              called = any(str(frame.get("module", "")).startswith("github.com/infinimesh/") for frame in finding.get("trace", []))
              version = finding.get("fixed_version")
              if called and version:
                  fixed.append(f"{finding.get('osv')} fixed in {version}")
          if fixed:
              print("Reachable vulnerabilities with a released fix:")
              print("\n".join(sorted(set(fixed))))
              sys.exit(1)
          print("No reachable vulnerability has a released fix.")
          PY
