name: Publish Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-r[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stable release prerequisites
        run: sh scripts/check-stable.sh . "${GITHUB_REF_NAME}"

      - name: Prepare release notes from changelog
        id: notes
        run: |
          if NOTES=$(scripts/changelog-notes.sh "${GITHUB_REF_NAME}" CHANGELOG.md); then
            :
          else
            NOTES="Release notes not found in CHANGELOG.md for ${GITHUB_REF_NAME}"
          fi
          delim="notes_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "body<<${delim}"
            printf '%s\n' "$NOTES"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          files: api.swagger.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
