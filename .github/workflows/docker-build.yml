name: Docker Build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-r[0-9]+"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ (github.ref_name == 'master' || github.ref_name == 'main') && 'latest' || github.ref_name }}
  IMAGE_REPO: ${{ github.repository }}

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.list }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover Docker targets
        id: tags
        run: |
          TAGS_JSON=$(ls Dockerfiles | jq -cnR '[inputs | select(length>0)]')
          echo "list=$TAGS_JSON" >> "$GITHUB_OUTPUT"

      - name: Get latest version tag
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 --always)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.discover.outputs.tags) }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Image tags
        id: imgtags
        run: |
          delim="tags_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "yaml<<${delim}"
            sh scripts/image-tags.sh "${GITHUB_REF_NAME}" | while read -r t; do
              echo "type=raw,value=${t}"
            done
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/${{ matrix.tag }}
          tags: ${{ steps.imgtags.outputs.yaml }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: Dockerfiles/${{ matrix.tag }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_TAG=${{ env.IMAGE_TAG }}
            INFINIMESH_VERSION_TAG=${{ needs.discover.outputs.version }}

      - name: Publish summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### :whale: Published ${{ matrix.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.build.outputs.imageid }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  public:
    needs: [discover, build]
    if: github.event_name != 'pull_request' && needs.build.result != 'cancelled' && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.discover.outputs.tags) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Make the package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkg=$(printf '%s' "${{ github.event.repository.name }}/${{ matrix.tag }}" | jq -sRr @uri)
          gh api --method PATCH "/orgs/${{ github.repository_owner }}/packages/container/${pkg}" -f visibility=public || true
          check="${GITHUB_REF_NAME}"
          if [ "$check" = "main" ] || [ "$check" = "master" ]; then
            check=latest
          fi
          image="${{ github.repository }}/${{ matrix.tag }}"
          tok=$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:${image}:pull" | jq -er .token)
          curl -fsS -o /dev/null \
            -H "Authorization: Bearer ${tok}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/${image}/manifests/${check}"
