; One device. The bridge still sees the client certificate, not the PSK identity.
; 127.0.0.1:19001 is plaintext. Do not publish it.
; Replace the secrets file, certificate paths, and the example key.

[device-psk]
accept = 127.0.0.1:8884
connect = 127.0.0.1:19001
ciphers = PSK
PSKsecrets = hack/stunnel/psk-secrets.txt
sslVersionMin = TLSv1.2
sslVersionMax = TLSv1.2

[device-bridge]
client = yes
accept = 127.0.0.1:19001
connect = 127.0.0.1:8883
cert = device.crt
key = device.key
CAfile = hack/server-ec.crt
checkHost = localhost
verifyPeer = yes
sslVersionMin = TLSv1.2
