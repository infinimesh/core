version: "3.8"
services:

  # Optional auto-updater for production deployments (opt-in via profiles)
  watchtower:
    image: containrrr/watchtower:1.7.1
    command: --interval 30 --cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles: ["prod"]

  proxy:
    image: traefik:2.11.58
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.${BASE_DOMAIN}`)
      - traefik.http.routers.traefik.entrypoints=https
      - traefik.http.routers.traefik.tls.certresolver=letsencrypt
      - traefik.http.routers.traefik.service=api@internal
    ports:
      - 80:80
      - 443:443
      - 8000:8000
    volumes:
      - ./traefik.yml:/traefik.yml
      - ./letsencrypt:/etc/traefik/acme
      - /var/run/docker.sock:/var/run/docker.sock

  console:
    image: "ghcr.io/infinimesh/core/console:${INFINIMESH_VERSION}"
    restart: always
    depends_on:
      - proxy
      - gateway
    labels:
      - traefik.enable=true
      - traefik.http.routers.console.rule=Host(`console.${BASE_DOMAIN}`)
      - traefik.http.routers.console.entrypoints=https
      - traefik.http.routers.console.tls.certresolver=letsencrypt
      - traefik.http.routers.console.service=console@docker
      - traefik.http.services.console.loadbalancer.server.port=80
  gateway:
    image: "ghcr.io/infinimesh/core/gateway:${INFINIMESH_VERSION}"
    restart: always
    depends_on:
      - api
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.gateway.rule=Host(`api.${BASE_DOMAIN}`)
      - traefik.http.routers.gateway.entrypoints=https
      - traefik.http.routers.gateway.tls.certresolver=letsencrypt
      - traefik.http.routers.gateway.service=gateway@docker
      - traefik.http.services.gateway.loadbalancer.server.port=8000
    environment:
      APISERVER_HOST: api:8000
      # Optional CA for TLS between gateway and api; leave empty for insecure
      APISERVER_CA_FILE: /cert/tls.crt
      HTTP_FS: "https://media.${BASE_DOMAIN}"
      PAIRING: pairing:8000
    volumes:
      - ./hack/server.crt:/cert/tls.crt:ro

  rabbitmq:
    image: rabbitmq:3.9-management
    labels:
      - traefik.enable=false
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS}"
    volumes:
      - rbmq_data:/var/lib/rabbitmq
      - rbmq_log:/var/log/rabbitmq

  mqtt:
    image: "ghcr.io/infinimesh/core/mqtt-bridge:${INFINIMESH_VERSION}"
    restart: always
    depends_on:
      - rabbitmq
      - api
      - proxy
    ports:
      - 1883:1883 # BasicAuth(non-TLS)
      - 8883:8883 # Standard(TLS)
      - 2112:2112 # Metrics
    volumes:
      - ./hack/server.crt:/cert/tls.crt
      - ./hack/server.key:/cert/tls.key
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      RABBITMQ_CONN: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      DEVICES_HOST: api:8000
      SHADOW_HOST: shadow:8000
      SIGNING_KEY: "${SIGNING_KEY}"
      MQTT_PLAINTEXT: "1"

  api:
    image: "ghcr.io/infinimesh/core/api:${INFINIMESH_VERSION}"
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.${BASE_DOMAIN}`)
      - traefik.http.routers.api.entrypoints=grpc
      - traefik.http.routers.api.service=api@docker
      - traefik.http.services.api.loadbalancer.server.port=8000
      - traefik.http.services.api.loadbalancer.server.scheme=h2c

      - traefik.http.routers.api_connect.rule=Host(`api.${BASE_DOMAIN}`)&&PathPrefix("/infinimesh.node.", "/infinimesh.shadow", "/infinimesh.plugins", "/oauth")
      - traefik.http.routers.api_connect.entrypoints=https
      - traefik.http.routers.api_connect.tls.certresolver=letsencrypt
      - traefik.http.routers.api_connect.service=api_connect@docker
      - traefik.http.services.api_connect.loadbalancer.server.port=8000
      - traefik.http.services.api_connect.loadbalancer.server.scheme=h2c

    depends_on:
      - db
      - proxy
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      DB_HOST: db:8529
      DB_CRED: root:openSesame
      SHADOW_HOST: shadow:8000
      INF_DEFAULT_ROOT_PASS: infinimesh
      SIGNING_KEY: "${SIGNING_KEY}"
      PAIRING_HOST: pairing:8000

      OAUTH_PORT: 80
      REGISTRY_HOST: api:8000
      NAMESPACES_HOST: api:8000
      CORS_ALLOWED: "https://*.${BASE_DOMAIN},https://*"
    volumes:
      - ./oauth2_config.yaml:/oauth2_config.yaml

  coap:
    image: "ghcr.io/infinimesh/core/coap-gateway:${INFINIMESH_VERSION}"
    profiles: ["coap"]
    restart: unless-stopped
    labels:
      - traefik.enable=false
    ports:
      # Plaintext UDP. No DTLS in this process. Do not publish this off a private network.
      - "5683:5683/udp"
    depends_on:
      - rabbitmq
    environment:
      COAP_ADDR: ":5683"
      RABBITMQ_CONN: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/

  rules:
    image: "ghcr.io/infinimesh/core/rules:${INFINIMESH_VERSION}"
    restart: unless-stopped
    labels:
      - traefik.enable=false
    depends_on:
      - db
      - redis
      - shadow
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      DB_HOST: db:8529
      DB_CRED: root:openSesame
      REDIS_HOST: redis:6379
      SHADOW_HOST: shadow:8000
      INF_DEFAULT_ROOT_PASS: infinimesh

  shadow:
    image: "ghcr.io/infinimesh/core/shadow:${INFINIMESH_VERSION}"
    restart: unless-stopped
    labels:
      - traefik.enable=false
    depends_on:
      - redis
      - rabbitmq
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      RABBITMQ_CONN: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      REDIS_HOST: redis:6379
      DEVICES_HOST: api:8000
      SIGNING_KEY: "${SIGNING_KEY}"

  redis:
    image: redis:7.4.11
    labels:
      - traefik.enable=false
    command: [ "redis-server", "--appendonly", "yes" ]

  db:
    image: arangodb:3.12.12
    restart: always
    environment:
      ARANGO_ROOT_PASSWORD: openSesame
    labels:
      - traefik.enable=false
    volumes:
      - data:/var/lib/arangodb3

  http-fs:
    image: "ghcr.io/infinimesh/core/http-fs:${INFINIMESH_VERSION}"
    restart: always
    depends_on:
      - db
    labels:
      - traefik.enable=true
      - traefik.http.routers.http-fs.rule=Host(`media.${BASE_DOMAIN}`)
      - traefik.http.routers.http-fs.entrypoints=https
      - traefik.http.routers.http-fs.tls.certresolver=letsencrypt
      - traefik.http.services.http-fs.loadbalancer.server.port=8000
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      DB_HOST: db:8529
      DB_CRED: root:openSesame
      INF_DEFAULT_ROOT_PASS: infinimesh
      SIGNING_KEY: "${SIGNING_KEY}"
      HTTP_FS_ROOT: /static
    volumes:
      - user-media:/static

  # Comment this service and PAIRING on gateway to disable pairing
  pairing:
    image: "ghcr.io/infinimesh/core/pairing:${INFINIMESH_VERSION}"
    restart: always
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      SIGNING_KEY: "${SIGNING_KEY}"
    labels:
      - traefik.enable=true
      - traefik.http.routers.pairing.rule=Host(`api.${BASE_DOMAIN}`)&&PathPrefix("/infinimesh.pairing.")
      - traefik.http.routers.pairing.entrypoints=grpc
      - traefik.http.services.pairing.loadbalancer.server.port=8000
      - traefik.http.services.pairing.loadbalancer.server.scheme=h2c

volumes:
  data:
  user-media:
  rbmq_data:
  rbmq_log:
